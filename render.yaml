databases:
  - name: playpulse-db
    databaseName: playpulse
    plan: free

services:
  - type: web
    name: playpulse-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLUB_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: playpulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
