databases:
  - name: playpulse-db
    databaseName: playpulse
    plan: 0.5c-1g

services:
  - type: web
    name: playpulse-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLUB_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: playpulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
